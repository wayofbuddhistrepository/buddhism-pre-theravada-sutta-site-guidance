<!doctype html><html lang="si"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SuttaGo Research Lab</title><style>body{margin:0;background:#f8f7f1;color:#1f3c35;font:17px/1.85 system-ui,sans-serif}main{max-width:780px;margin:auto;padding:24px}h1{line-height:1.3;font-size:2.3rem}small{color:#60746a}textarea{box-sizing:border-box;width:100%;font:inherit;border:1px solid #aabbb2;padding:14px;border-radius:12px;margin:12px 0}button,select{font:inherit;border-radius:8px;padding:9px 15px;border:1px solid #167165}button{background:#155e51;color:white;cursor:pointer}article,details{background:white;border:1px solid #d9dfd9;padding:18px;border-radius:12px;margin:16px 0}a{color:#176b59}summary{cursor:pointer;font-weight:600}p{white-space:pre-wrap;overflow-wrap:anywhere}header{border-bottom:1px solid #d9dfd9}</style><main><header><small id="tag">ස්වාධීන පරීක්ෂණ පරිසරය</small><h1 id="title">☸ සූත්‍ර ගවේෂණය</h1></header><p id="intro">ථේරවාදී ධර්ම මූලාශ්‍ර පර්යේෂණය</p><form><select id="lang" aria-label="Language"><option value="auto">Auto</option><option value="si">සිංහල</option><option value="en">English</option><option value="pli">Pāli</option></select><textarea id="q" maxlength="500" required rows="3" placeholder="කල්පය ගැන කියන්න"></textarea><button id="go">විමසන්න</button></form><section id="out" aria-live="polite"></section><small id="note">සීමිත පරීක්ෂණ දත්ත. මෙය සම්පූර්ණ AI පද්ධතිය නොවේ.</small></main><script>const $=s=>document.querySelector(s);const words={si:['ස්වාධීන පරීක්ෂණ පරිසරය','☸ සූත්‍ර ගවේෂණය','ථේරවාදී ධර්ම මූලාශ්‍ර පර්යේෂණය','විමසන්න','සීමිත පරීක්ෂණ දත්ත. මෙය සම්පූර්ණ AI පද්ධතිය නොවේ.','මූලාශ්‍ර සොයමින්…','මුල් සූත්‍රය','පාලි පාඨය','අටුවාව (වෙනම)','පාලි මූලපාඨය ලබාගනිමින්…','පාඨය ලබාගත නොහැකි විය.','තාවකාලික දෝෂයකි.'],en:['Isolated research lab','☸ Sutta Research','Theravāda canonical research','Ask','Limited test data. This is not the complete AI system.','Finding sources…','Canonical text','Pāli text','Commentary (separate)','Loading Pāli source…','Source unavailable.','Temporary error.'],pli:['Parikkhā','☸ Suttapariyesanā','Theravāda','Puccha','Parikkhāmattaṃ','Pariyesati…','Mūlapāṭha','Pāḷi','Aṭṭhakathā','Mūlapāṭhaṃ…','Na laddho.','Na sakkā.']};let auto=q=>/[\u0d80-\u0dff]/u.test(q)?'si':'en';function language(l){let w=words[l];document.documentElement.lang=l;['tag','title','intro','go','note'].forEach((x,i)=>$('#'+x).textContent=w[i]);$('#q').placeholder=l==='si'?'කල්පය ගැන කියන්න':l==='pli'?'kappa':'What is an eon?';return w}function add(p,t,v){let e=document.createElement(t);e.textContent=v;p.append(e);return e}function link(p,u,t){if(!u)return;let a=add(p,'a',t);a.href=u;a.rel='noopener noreferrer';a.target='_blank';p.append(document.createElement('br'))}$('#lang').onchange=()=>language($('#lang').value==='auto'?auto($('#q').value||'සිංහල'):$('#lang').value);$('form').onsubmit=async e=>{e.preventDefault();let q=$('#q').value,l=$('#lang').value==='auto'?auto(q):$('#lang').value,w=language(l),o=$('#out');o.replaceChildren();add(o,'p',w[5]);$('#go').disabled=true;try{let r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,lang:l})});if(!r.ok)throw Error();let d=await r.json();o.replaceChildren();let ar=add(o,'article','');add(ar,'small',d.label);add(ar,'p',d.answer);for(let s of d.sources){let b=add(o,'details','');add(b,'summary',s.id.toUpperCase()+' · '+s.title);if(s.detail)add(b,'p',s.detail);link(b,s.primary,w[6]);link(b,s.pali,w[7]);link(b,s.commentary,w[8]);b.addEventListener('toggle',async()=>{if(!b.open||b.dataset.loaded)return;let p=add(b,'p',w[9]);try{let r=await fetch('/api/ask?id='+encodeURIComponent(s.id));let j=await r.json();if(!r.ok||!j.text)throw Error();p.textContent=j.text;b.dataset.loaded='1';link(b,j.source,'SuttaCentral · Bilara');}catch{p.textContent=w[10]}})}}catch{o.replaceChildren();add(o,'p',w[11])}finally{$('#go').disabled=false}}</script></html>

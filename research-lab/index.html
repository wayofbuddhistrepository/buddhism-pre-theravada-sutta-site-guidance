<!doctype html><html lang="si"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SuttaGo Research Lab</title><style>body{margin:0;background:#f8f7f1;color:#1f3c35;font:17px/1.85 system-ui,sans-serif}main{max-width:780px;margin:auto;padding:24px}h1{line-height:1.3;font-size:2.3rem}small{color:#60746a}textarea{box-sizing:border-box;width:100%;font:inherit;border:1px solid #aabbb2;padding:14px;border-radius:12px;margin:12px 0}button,select{font:inherit;border-radius:8px;padding:9px 15px;border:1px solid #167165}button{background:#155e51;color:white;cursor:pointer}article,details{background:white;border:1px solid #d9dfd9;padding:18px;border-radius:12px;margin:16px 0}a{color:#176b59}summary{cursor:pointer;font-weight:600}p{white-space:pre-wrap;overflow-wrap:anywhere}header{border-bottom:1px solid #d9dfd9}</style><main><header><small id="tag">ස්වාධීන පරීක්ෂණ පරිසරය</small><h1 id="title">☸ සූත්‍ර ගවේෂණය</h1></header><p id="intro">ථේරවාදී ධර්ම මූලාශ්‍ර පර්යේෂණය</p><form><select id="lang" aria-label="Language"><option value="auto">Auto</option><option value="si">සිංහල</option><option value="en">English</option><option value="pli">Pāli</option></select><select id="mode" aria-label="Research depth"><option value="auto">Auto</option><option value="quick">Quick</option><option value="deep">Deep research</option></select><textarea id="q" maxlength="500" required rows="3" placeholder="කල්පය ගැන කියන්න"></textarea><button id="go">විමසන්න</button></form><small id='privacy'>AI සේවාවට ප්‍රශ්නය හා පොදු මූලාශ්‍ර යැවිය හැක. පුද්ගලික දත්ත ඇතුළත් නොකරන්න.</small><section id="out" aria-live="polite"></section><small id="note">සජීවී මූලාශ්‍ර පර්යේෂණය. AI විග්‍රහය සක්‍රිය වන තෙක් මුල් පාඨ පමණක් භාවිත වේ.</small></main><script>const $=s=>document.querySelector(s);const words={si:['ස්වාධීන පරීක්ෂණ පරිසරය','☸ සූත්‍ර ගවේෂණය','ථේරවාදී ධර්ම මූලාශ්‍ර පර්යේෂණය','විමසන්න','සූත්‍ර සම්බන්ධතා සහ සජීවී මූලාශ්‍ර පර්යේෂණය. AI model සක්‍රිය කර නැති පිළිතුරු පැහැදිලිව සලකුණු කර ඇත.','මූලාශ්‍ර සොයමින්…','මුල් සූත්‍රය','පාලි පාඨය','අටුවාව (වෙනම)','මුල් මූලාශ්‍ර පාඨය ලබාගනිමින්…','පාඨය ලබාගත නොහැකි විය.','තාවකාලික දෝෂයකි.'],en:['Isolated research lab','☸ Sutta Research','Theravāda canonical research','Ask','Live canonical retrieval. AI analysis requires a configured model.','Finding sources…','Canonical text','Pāli text','Commentary (separate)','Loading source…','Source unavailable.','Temporary error.'],pli:['Parikkhā','☸ Suttapariyesanā','Theravāda','Puccha','Parikkhāmattaṃ','Pariyesati…','Mūlapāṭha','Pāḷi','Aṭṭhakathā','Mūlapāṭhaṃ…','Na laddho.','Na sakkā.']};let auto=q=>/[\u0d80-\u0dff]/u.test(q)?'si':'en';function language(l){let w=words[l];document.documentElement.lang=l;['tag','title','intro','go','note'].forEach((x,i)=>$('#'+x).textContent=w[i]);$('#privacy').textContent=l==='si'?'AI සේවාවට ප්‍රශ්නය හා පොදු මූලාශ්‍ර යැවිය හැක. පුද්ගලික දත්ත ඇතුළත් නොකරන්න.':l==='en'?'The AI provider may retain questions and public evidence. Do not enter personal information.':'Puggalikadattaṃ mā likhatha.';let modes=$('#mode').options;modes[0].textContent=l==='si'?'ස්වයංක්‍රීය':l==='pli'?'Sayaṃ':'Auto';modes[1].textContent=l==='si'?'ඉක්මන්':l==='pli'?'Khippa':'Quick';modes[2].textContent=l==='si'?'ගැඹුරු පර්යේෂණ':l==='pli'?'Gambhīra':'Deep research';$('#q').placeholder=l==='si'?'කල්පය ගැන කියන්න':l==='pli'?'kappa':'What is an eon?';return w}function add(p,t,v){let e=document.createElement(t);e.textContent=v;p.append(e);return e}function link(p,u,t){if(!u)return;let a=add(p,'a',t);a.href=u;a.rel='noopener noreferrer';a.target='_blank';p.append(document.createElement('br'))}$('#lang').onchange=()=>language($('#lang').value==='auto'?auto($('#q').value||'සිංහල'):$('#lang').value);$('form').onsubmit=async e=>{e.preventDefault();let q=$('#q').value,l=$('#lang').value==='auto'?auto(q):$('#lang').value,w=language(l),o=$('#out');o.replaceChildren();add(o,'p',w[5]);$('#go').disabled=true;try{let r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,lang:l,mode:$('#mode').value})});if(!r.ok)throw Error();let d=await r.json();o.replaceChildren();let ar=add(o,'article','');add(ar,'small',d.label);add(ar,'p',d.answer);if(window.SuttaPoster&&d.sources?.length)window.SuttaPoster.attach(ar,d,q,l);if(d.research){let rr=add(ar,'details','');add(rr,'summary',l==='si'?'පර්යේෂණ කණ්ඩායම්':l==='en'?'Research teams':'Pariyesanā');for(let t of d.research.teams){const names={si:{corpus:'දේශීය දත්ත',live:'සජීවී මූලාශ්‍ර',facet:'විමසුමේ අංශය',bjt:'ත්‍රිපිටක සජීවී පූර්ණපාඨ'},en:{corpus:'Local corpus',live:'Live sources',facet:'Question facet',bjt:'Live BJT full-text'},pli:{corpus:'Ganthā',live:'Pāṭhā',facet:'Aṅga',bjt:'BJT pāṭha'}};add(rr,'p',(names[l][t.name]||t.name)+' · '+t.count)}add(rr,'p',(l==='si'?'මුල් පාඨ පරීක්ෂා කළ මූලාශ්‍ර: ':l==='en'?'Source pages checked: ':'Pāṭhā: ')+d.research.verified);add(rr,'p',(l==='si'?'පිළිතුරු මාදිලිය: ':l==='en'?'Answer model: ':'AI: ')+(d.research.model||(l==='si'?'AI නොවේ':'No AI generation')))}for(let s of d.sources){let b=add(o,'details','');add(b,'summary',(s.canonicalId||s.id.toUpperCase())+' · '+s.title);if(s.detail)add(b,'p',s.detail);if(s.facet)add(b,'small',(l==='si'?'විමසුමේ අංශය: ':'Question facet: ')+s.facet);if(s.origin)add(b,'small',s.origin+(s.evidenceType==='source_search_excerpt'?(l==='si'?' · සෙවුම් පාඨ කොටස':' · search excerpt'):''));if(s.comparisonUrl)link(b,s.comparisonUrl,l==='si'?'සංසන්දනාත්මක මූලාශ්‍රය':'Comparison source');link(b,s.primary,w[6]);link(b,s.pali,w[7]);link(b,s.commentary,w[8]);b.addEventListener('toggle',async()=>{if(!b.open||b.dataset.loaded)return;if(s.id.startsWith('dto:')){b.dataset.loaded='1';return;}let p=add(b,'p',w[9]);try{let r=await fetch('/api/ask?id='+encodeURIComponent(s.id)+'&lang='+encodeURIComponent(l));let j=await r.json();if(!r.ok||!j.text)throw Error();p.textContent=j.text;b.dataset.loaded='1';fetch('/api/ask?related='+encodeURIComponent(s.id)).then(x=>x.json()).then(x=>{if(!x.related?.length)return;let rb=add(b,'div','');add(rb,'h3',l==='si'?'සම්බන්ධ සූත්‍ර සහ පාඨ':l==='en'?'Related discourses and passages':'Sambandhasuttāni');add(rb,'small',l==='si'?'SuttaCentral හි සමාන්තර පාඨ දර්ශකය — සම්පූර්ණ අර්ථ සමානත්වයක් නොවේ.':'SuttaCentral parallels index; not necessarily identical teachings.');for(let r of x.related){let label=r.id.toUpperCase()+' · '+(l==='si'?(r.type==='parallel'?'සමාන්තර සූත්‍රය':r.type==='passage_parallel'?'සමාන්තර පාඨය':'සම්බන්ධ පාඨය'):r.type.replaceAll('_',' '));link(rb,r.url,label)}}).catch(()=>{});link(b,j.source,l==='si'?'මුල් මූලාශ්‍රය':'Original source');if(j.nextStart!=null){let more=add(b,'button',l==='si'?'තවත් පාඨ පෙන්වන්න':l==='en'?'Load more text':'Aññaṃ pāṭhaṃ');let next=j.nextStart;more.addEventListener('click',async()=>{more.disabled=true;try{let r2=await fetch('/api/ask?id='+encodeURIComponent(s.id)+'&lang='+encodeURIComponent(l)+'&start='+next);let d2=await r2.json();if(!r2.ok||!d2.text)throw Error();p.textContent+='\n\n'+d2.text;next=d2.nextStart;if(next==null)more.remove();else more.disabled=false}catch{more.disabled=false;more.textContent=l==='si'?'නැවත උත්සාහ කරන්න':'Try again'}})}}catch{p.textContent=w[10]}})}}catch{o.replaceChildren();add(o,'p',w[11])}finally{$('#go').disabled=false}}
</script><script src="/poster.js" defer></script></html>

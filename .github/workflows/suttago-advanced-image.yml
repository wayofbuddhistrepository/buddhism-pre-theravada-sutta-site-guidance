name: SuttaGo advanced anime CPU models
on:
  push:
    branches: [isolated-suttago-lab]
    paths: ['.github/workflows/suttago-advanced-image.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        engine: [flux, sana, sdxl, upscale, sdxs]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          free -h
          df -h .
          python -m pip install 'huggingface_hub>=0.34,<1' pillow
          if [ "${{ matrix.engine }}" != flux ]; then
            python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          fi
          if [ "${{ matrix.engine }}" = upscale ]; then
            python -m pip install basicsr==1.4.2 realesrgan==0.3.0 'numpy<2' 'opencv-python-headless<4.12'
          elif [ "${{ matrix.engine }}" != flux ]; then
            python -m pip install --only-binary=tokenizers 'diffusers==0.35.2' 'transformers==4.55.4' 'tokenizers==0.21.4' accelerate sentencepiece safetensors
          fi
      - if: matrix.engine == 'flux'
        run: |
          git clone --recurse-submodules https://github.com/leejet/stable-diffusion.cpp.git /tmp/sd
          cd /tmp/sd
          git checkout master-1127-79dc7ca
          git submodule update --init --recursive
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON
          cmake --build build -j4
          CLI=$(find /tmp/sd/build -type f -name sd-cli -executable | head -1)
          test -n "$CLI"
          echo "SD_CLI=$CLI" >> "$GITHUB_ENV"
      - run: python research-lab/scripts/advanced_image_cpu.py ${{ matrix.engine }}
        env:
          OMP_NUM_THREADS: '4'
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-poster-${{ matrix.engine }}
          path: advanced-poster-output/
          retention-days: 7

name: SuttaGo CPU grounded Sinhala evaluation
on:
  push:
    branches: [isolated-suttago-lab]
    paths: ['.github/workflows/suttago-cpu-relevance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install sentence-transformers huggingface_hub==2.4.0 llama-cpp-python==0.3.38 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - run: python research-lab/scripts/cpu_relevance_test.py
        env:
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'

